baseURL: "/"
title: "Nicolas Massé"
author: "Nicolas Massé"
enableRobotsTXT: true
# Keep the taxonomy terms as they are written in the front matter
capitalizeListTitles: false

markup:
  goldmark:
    parser:
      # Standalone images are rendered as figures by the image render hook
      wrapStandAloneImageWithinParagraph: false
  highlight:
    # Use CSS classes for syntax highlighting. The style sheet is generated with:
    #   hugo gen chromastyles --style=borland > assets/css/chroma.css
    noClasses: false

defaultContentLanguage: "en"
languages:
  en:
    weight: 1
    label: English
    params:
      description: "Nicolas Massé's website: articles, talks and publications about Kubernetes, OpenShift, API Management, Single Sign-On and homelab."
    menu:
      main:
      - name: "Articles"
        weight: 10
        url: "/blog/"
      - name: "Open Source"
        weight: 20
        url: "/opensource/"
      - name: "Expertise"
        weight: 30
        url: "/topics/"
      - name: "Speaking"
        weight: 40
        url: "/speaking/"
      - name: "Writing"
        weight: 50
        url: "/writing/"
      - name: "Contact"
        weight: 60
        url: "/contact/"
      - name: "Resume"
        weight: 70
        url: "https://www.linkedin.com/in/nicolasmasse/"
  fr:
    weight: 2
    label: Français
    params:
      description: "Le site de Nicolas Massé : articles, conférences et publications sur Kubernetes, OpenShift, l'API Management, le Single Sign-On et le homelab."
    menu:
      main:
      - name: "Articles"
        weight: 10
        url: "/fr/blog/"
      - name: "Open Source"
        weight: 20
        url: "/fr/opensource/"
      - name: "Expertise"
        weight: 30
        url: "/fr/topics/"
      - name: "Conférences"
        weight: 40
        url: "/fr/speaking/"
      - name: "Publications"
        weight: 50
        url: "/fr/writing/"
      - name: "Me contacter"
        weight: 60
        url: "/fr/contact/"
      - name: "CV"
        weight: 70
        url: "https://www.linkedin.com/in/nicolasmasse/"

# The french site contains the french content plus the english content that
# has not been translated (french files take precedence over english files).
module:
  mounts:
  # Default assets mount, plus the images of the static directory so that
  # they can be processed by Hugo (social images).
  - source: assets
    target: assets
  - source: static/images
    target: assets/images
  - source: content/english
    target: content
    sites:
      matrix:
        languages: [en]
  - source: content/french
    target: content
    sites:
      matrix:
        languages: [fr]
  - source: content/english
    target: content
    sites:
      matrix:
        languages: [fr]

# Embed YouTube videos from youtube-nocookie.com: no cookie is set until
# the visitor plays the video.
privacy:
  youtube:
    privacyEnhanced: true

# The search index, used by the search page (static/js/search.js)
outputFormats:
  searchindex:
    mediaType: application/json
    baseName: index
    isPlainText: true
    notAlternative: true

taxonomies:
  opensource: "opensource"
  topic: "topics"
  tags: "tags"

params:
  enablePlausible: false
  # Used in the structured data (JSON-LD)
  author:
    name: "Nicolas Massé"
    url: "https://www.linkedin.com/in/nicolasmasse/"
  images:
  - /images/avatar-2022-12.webp

# Only publish the page resources that are actually used (images, attached
# files, etc.) and not the source files that sit next to them (xcf, heic,
# raw videos, etc.).
cascade:
  build:
    publishResources: false
