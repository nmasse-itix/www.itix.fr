baseURL: "/"
title: "Nicolas Massé"
author: "Nicolas Massé"
enableRobotsTXT: true
# Keep the taxonomy terms as they are written in the front matter
capitalizeListTitles: false

markup:
  highlight:
    # Use CSS classes for syntax highlighting. The style sheet is generated with:
    #   hugo gen chromastyles --style=borland > assets/css/chroma.css
    noClasses: false

defaultContentLanguage: "en"
languages:
  en:
    weight: 1
    label: English
    menu:
      main:
      - name: "Articles"
        weight: 10
        url: "/blog/"
      - name: "Open Source"
        weight: 20
        url: "/opensource/"
      - name: "Expertise"
        weight: 30
        url: "/topics/"
      - name: "Speaking"
        weight: 40
        url: "/speaking/"
      - name: "Writing"
        weight: 50
        url: "/writing/"
      - name: "Contact"
        weight: 60
        url: "/contact/"
      - name: "Resume"
        weight: 70
        url: "https://www.linkedin.com/in/nicolasmasse/"
  fr:
    weight: 2
    label: Français
    menu:
      main:
      - name: "Articles"
        weight: 10
        url: "/fr/blog/"
      - name: "Open Source"
        weight: 20
        url: "/fr/opensource/"
      - name: "Expertise"
        weight: 30
        url: "/fr/topics/"
      - name: "Conférences"
        weight: 40
        url: "/fr/speaking/"
      - name: "Publications"
        weight: 50
        url: "/fr/writing/"
      - name: "Me contacter"
        weight: 60
        url: "/fr/contact/"
      - name: "CV"
        weight: 70
        url: "https://www.linkedin.com/in/nicolasmasse/"

# The french site contains the french content plus the english content that
# has not been translated (french files take precedence over english files).
module:
  mounts:
  - source: content/english
    target: content
    sites:
      matrix:
        languages: [en]
  - source: content/french
    target: content
    sites:
      matrix:
        languages: [fr]
  - source: content/english
    target: content
    sites:
      matrix:
        languages: [fr]

taxonomies:
  opensource: "opensource"
  topic: "topics"
  tags: "tags"

params:
  enablePlausible: false
  images:
  - /images/avatar-2022-12.webp

# Only publish the page resources that are actually used (images, attached
# files, etc.) and not the source files that sit next to them (xcf, heic,
# raw videos, etc.).
cascade:
  build:
    publishResources: false
